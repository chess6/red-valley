; Committed export preset used by the release workflow.
;
; The repository's own export_presets.cfg is gitignored (Godot rewrites it with
; machine-local paths), so a release build cannot rely on it. This file is the
; reviewable copy: CI copies it to the repository root before exporting, which
; means the exclusion list below is under code review like anything else.
;
; exclude_filter must keep every evaluation root out of the package.
; tools/asset_gate.py check enforces that; tools/asset_gate.py sync-presets
; writes it in. Do not remove art/character/ai_generated/* — that output is
; licensed for research/evaluation only and cannot ship.

[preset.0]

name="Linux"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="art/character/ai_generated/*, art/*, tools/*, tests/*, docs/*, .github/*, *.blend, *.blend1, *.py"
export_path="build/red_valley.x86_64"
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
